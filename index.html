<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="./icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scramjet Demo</title>

		<script src="./scramjet/scramjet.js"></script>
		<script src="./controller/controller.api.js"></script>
		<script type="module" crossorigin src="./assets/index-CPnrfrEF.js"></script>
		<link rel="stylesheet" crossorigin href="./assets/index-cUh8D1R6.css">
	</head>

	<body class="light-mode">
		<div id="app"></div>

		<script>
			async function requestFullscreenAndKeyLock() {
				try {
					// Request fullscreen on the document root element
					if (!document.fullscreenElement) {
						await document.documentElement.requestFullscreen();
					}

					// Request Keyboard Lock (supported in Chromium-based browsers)
					if ('keyboard' in navigator && 'lock' in navigator.keyboard) {
						await navigator.keyboard.lock();
					}
				} catch (err) {
					console.warn('Fullscreen or Keyboard Lock request failed:', err);
				}
			}

			// User interaction triggers needed due to browser security policies
			window.addEventListener('click', requestFullscreenAndKeyLock, { once: true });
			window.addEventListener('keydown', requestFullscreenAndKeyLock, { once: true });
		</script>
	</body>
</html>
